<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 语音生成站</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #d1d5db;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; padding: 40px 20px;
        }
        .card {
            background: var(--card-bg); width: 100%; max-width: 640px; padding: 32px;
            border-radius: var(--radius); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 24px; margin-bottom: 24px; text-align: center; color: #111827; }
        .form-group { margin-bottom: 20px; }
        label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #4b5563; }
        textarea, select {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 15px; transition: border-color 0.2s; background: white;
        }
        textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        textarea { min-height: 120px; resize: vertical; font-family: inherit; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        input[type="range"] { width: 100%; margin-top: 8px; accent-color: var(--primary); cursor: pointer; }
        button {
            width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover:not(:disabled) { background: var(--primary-hover); }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #result { margin-top: 24px; padding-top: 24px; border-top: 1px dashed var(--border); display: none; }
        audio { width: 100%; margin-bottom: 16px; }
        .download-btn {
            display: block; text-align: center; padding: 12px; background: #10b981; color: white;
            text-decoration: none; border-radius: 8px; font-weight: 500; transition: 0.2s;
        }
        .download-btn:hover { background: #059669; }
        
        /* 底部链接样式 */
        .footer-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Toast 提示样式 */
        #toast {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; font-size: 14px; font-weight: 500;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } .card { padding: 20px; } }
    </style>
</head>
<body>
    <!-- 顶部提示框 -->
    <div id="toast"></div>

    <div class="card">
        <h1>🎙️ AI语音生成站</h1>
        <div class="form-group">
            <label>输入文本 <span id="char-count" style="font-weight:normal; color:#9ca3af;">0 字</span></label>
            <textarea id="text" placeholder="请输入需要转换的文字..."></textarea>
        </div>
        
        <div class="grid">
            <div class="form-group">
                <label>音色选择</label>
                <select id="voice">
                    <optgroup label="女声">
                        <option value="zh-CN-XiaoxiaoNeural">晓晓 (温柔)</option>
                        <option value="zh-CN-XiaoyiNeural">晓伊 (甜美)</option>
                        <option value="zh-CN-XiaochenNeural">晓辰 (知性)</option>
                        <option value="zh-CN-XiaohanNeural">晓涵 (优雅)</option>
                        <option value="zh-CN-XiaomengNeural">晓梦 (梦幻)</option>
                        <option value="zh-CN-XiaomoNeural">晓墨 (文艺)</option>
                        <option value="zh-CN-XiaoqiuNeural">晓秋 (成熟)</option>
                        <option value="zh-CN-XiaoruiNeural">晓睿 (智慧)</option>
                        <option value="zh-CN-XiaoshuangNeural">晓双 (活泼)</option>
                        <option value="zh-CN-XiaoxuanNeural">晓萱 (清新)</option>
                        <option value="zh-CN-XiaoyanNeural">晓颜 (柔美)</option>
                        <option value="zh-CN-XiaoyouNeural">晓悠 (悠扬)</option>
                        <option value="zh-CN-XiaozhenNeural">晓甄 (端庄)</option>
                    </optgroup>
                    <optgroup label="男声">
                        <option value="zh-CN-YunxiNeural">云希 (清朗)</option>
                        <option value="zh-CN-YunyangNeural">云扬 (阳光)</option>
                        <option value="zh-CN-YunjianNeural">云健 (稳重)</option>
                        <option value="zh-CN-YunfengNeural">云枫 (磁性)</option>
                        <option value="zh-CN-YunhaoNeural">云皓 (豪迈)</option>
                        <option value="zh-CN-YunxiaNeural">云夏 (热情)</option>
                        <option value="zh-CN-YunyeNeural">云野 (野性)</option>
                        <option value="zh-CN-YunzeNeural">云泽 (深沉)</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label>语音风格</label>
                <select id="style">
                    <option value="general">通用 (General)</option>
                    <option value="chat">聊天对话 (Chat)</option>
                    <option value="newscast">新闻播报 (Newscast)</option>
                    <option value="customerservice">专业客服 (Service)</option>
                    <option value="assistant">智能助手 (Assistant)</option>
                    <option value="affectionate">亲切温暖 (Affectionate)</option>
                    <option value="calm">平静舒缓 (Calm)</option>
                    <option value="cheerful">愉快欢乐 (Cheerful)</option>
                    <option value="gentle">温和柔美 (Gentle)</option>
                    <option value="lyrical">抒情诗意 (Lyrical)</option>
                    <option value="serious">严肃正式 (Serious)</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div class="form-group">
                <label>语速 <span id="speed-val">1.0x</span></label>
                <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="form-group">
                <label>音调 <span id="pitch-val">0</span></label>
                <input type="range" id="pitch" min="-50" max="50" step="1" value="0">
            </div>
        </div>
        
        <button id="generate">生成语音</button>
        
        <div id="result">
            <audio id="audio" controls></audio>
            <a id="download" class="download-btn" download="speech.mp3">下载 MP3 文件</a>
        </div>
    </div>

    <!-- 底部 GitHub 链接 -->
    <a href="https://github.com/Zhi-xiaoxiao/tts-free-studios" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
    <h4> 作者：志校儿 </h4>
    <script>
        const API_URL = 'https://tts.wangwangit.com/v1/audio/speech';
        
        // Toast 提示函数
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // UI 元素绑定
        const textArea = document.getElementById('text');
        const charCount = document.getElementById('char-count');
        const speedInput = document.getElementById('speed');
        const speedVal = document.getElementById('speed-val');
        const pitchInput = document.getElementById('pitch');
        const pitchVal = document.getElementById('pitch-val');
        
        textArea.addEventListener('input', () => charCount.textContent = textArea.value.length + ' 字');
        speedInput.addEventListener('input', () => speedVal.textContent = speedInput.value + 'x');
        pitchInput.addEventListener('input', () => pitchVal.textContent = pitchInput.value);

        document.getElementById('generate').addEventListener('click', async function() {
            const text = textArea.value.trim();
            if (!text) {
                showToast('请输入要转换的文字');
                return;
            }

            const btn = this;
            const resultDiv = document.getElementById('result');
            const audio = document.getElementById('audio');
            const download = document.getElementById('download');

            btn.disabled = true;
            btn.textContent = '正在生成，请稍候...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: text,
                        voice: document.getElementById('voice').value,
                        speed: parseFloat(speedInput.value),
                        pitch: pitchInput.value, 
                        style: document.getElementById('style').value
                    })
                });

                if (!response.ok) throw new Error('服务器异常');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                audio.src = url;
                download.href = url;
                resultDiv.style.display = 'block';
                audio.play();
            } catch (err) {
                showToast('生成失败，请稍后重试');
                console.error('TTS Error:', err);
            } finally {
                btn.disabled = false;
                btn.textContent = '生成语音';
            }
        });
    </script>
</body>
</html>
